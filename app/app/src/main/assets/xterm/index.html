<!doctype html>
<!--
  k60-linbox 内嵌终端：xterm.js（MIT）负责渲染，PTY 由设备端 `linbox attach`
  （busybox script）提供。数据一律 base64 走 JS 桥，主机侧只在主线程碰 WebView。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #t { width: 100%; height: 100%; padding: 2px 0 0 2px; box-sizing: border-box; }
    #hint { position: absolute; left: 8px; bottom: 6px; color: #777; font: 12px monospace; }
  </style>
</head>
<body>
  <div id="t"></div>
  <div id="hint"></div>
  <script src="xterm.js"></script>
  <script>
  (function () {
    var FONT_SIZE = 14;
    var CHAR_H = Math.round(FONT_SIZE * 1.2);   // 等宽字体行高的近似值
    var CHAR_W = Math.round(FONT_SIZE * 0.6);   // 等宽字体字符宽的近似值
    var MAX_WAIT = 60;                          // 最多等 6 秒布局稳定

    var term = null;
    var booted = false;
    var encoder = new TextEncoder();

    function log(msg) {
      try { LinboxBridge.log(msg); } catch (e) { }
    }

    function toBase64(bytes) {
      var s = '';
      for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      return btoa(s);
    }

    // Kotlin -> 终端：xterm 的 write 接受 Uint8Array，会自行做 UTF-8 解码，
    // 所以跨 chunk 切断的多字节字符也能正确拼回来。
    window.linboxFeed = function (base64) {
      if (!term) return;
      var bin = atob(base64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      term.write(bytes);
    };

    window.linboxExit = function (code) {
      if (!term) return;
      term.write('\r\n\u001b[33m[会话已结束，退出码 ' + code + '] 点上方「重开会话」可重开\u001b[0m\r\n');
    };

    function viewport() {
      var el = document.getElementById('t');
      var rect = el.getBoundingClientRect();
      var w = rect.width > 0 ? rect.width : document.documentElement.clientWidth;
      var h = rect.height > 0 ? rect.height : document.documentElement.clientHeight;
      return [w, h];
    }

    // 关键：WebView 刚创建时布局还没稳定，这时候量出来会是「宽 428 高 85」这种离谱值
    // （实测 xterm 只画 5 行且文字看不见）。所以要等到尺寸合理再开终端。
    function boot(attempt) {
      if (booted) return;
      var size = viewport();
      if ((size[0] < 100 || size[1] < 100) && attempt < MAX_WAIT) {
        setTimeout(function () { boot(attempt + 1); }, 100);
        return;
      }
      booted = true;

      var el = document.getElementById('t');
      term = new Terminal({
        fontSize: FONT_SIZE,
        cursorBlink: true,
        scrollback: 2000,
        theme: { background: '#000000', foreground: '#e6e6e6' }
      });
      term.open(el);
      window.term = term;

      // 键盘输入 -> Kotlin（base64 承载 UTF-8 字节，避免中文/转义字符被破坏）
      term.onData(function (data) {
        try { LinboxBridge.write(toBase64(encoder.encode(data))); } catch (e) { }
      });

      var cols = Math.max(20, Math.floor(size[0] / CHAR_W));
      var rows = Math.max(5, Math.floor(size[1] / CHAR_H));
      term.resize(cols, rows);
      document.getElementById('hint').textContent = cols + 'x' + rows;
      log('measure ' + cols + 'x' + rows + ' (attempt ' + attempt + ')');

      // 行列数只报一次：busybox script 不支持会话中途 resize
      try { LinboxBridge.ready(cols, rows); } catch (e) { }
      term.focus();
    }

    if (document.readyState === 'complete') boot(0);
    else window.addEventListener('load', function () { boot(0); });
  })();
  </script>
</body>
</html>
