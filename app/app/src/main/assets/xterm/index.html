<!doctype html>
<!--
  k60-linbox 内嵌终端：xterm.js（MIT）负责渲染，PTY 由设备端 `linbox attach`
  （busybox script）提供。数据一律 base64 走 JS 桥，主机侧只在主线程碰 WebView。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="stylesheet" href="xterm.css">
  <style>
    /* 真机实测：WebView 里 html/body 的 height:100% 链不生效，宿主高度会塌成 0，
       再加上 body 的 overflow:hidden 就会把整块终端裁掉（表现为纯黑）。
       因此这里不再依赖百分比高度，改由脚本按量到的视口像素显式设置。 */
    html, body { margin: 0; padding: 0; background: #000; }
    #t { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="t"></div>
  <script src="xterm.js"></script>
  <script>
  (function () {
    var FONT_SIZE = 14;
    var CELL_H = FONT_SIZE * 1.15;   // 略保守，宁可少几行也不让末行被裁
    var CELL_W = FONT_SIZE * 0.62;   // 同上，避免列数超出可视宽度
    var MIN_W = 200;
    var MIN_H = 200;
    var MAX_TRIES = 30;          // 最多等 3 秒
    var FALLBACK_COLS = 80;      // 兜底：宁可列行数不准，也不能一直不连
    var FALLBACK_ROWS = 24;

    var term = null;
    var started = false;
    var encoder = new TextEncoder();

    function log(msg) {
      try { LinboxBridge.log(String(msg)); } catch (e) { }
    }

    // 页面级异常也要上报，否则渲染失败时这里一片静默
    window.addEventListener('error', function (e) {
      log('JS error: ' + (e && e.message ? e.message : e));
    });

    function toBase64(bytes) {
      var s = '';
      for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      return btoa(s);
    }

    function box(el) {
      if (!el) return 'none';
      return el.clientWidth + 'x' + el.clientHeight;
    }

    // 把宿主元素按视口像素钉死，绕开百分比高度在 WebView 里失效的问题。
    function fitHost(w, h) {
      var t = document.getElementById('t');
      t.style.width = w + 'px';
      t.style.height = h + 'px';
      t.style.overflow = 'hidden';
      document.documentElement.style.width = w + 'px';
      document.documentElement.style.height = h + 'px';
      document.body.style.width = w + 'px';
      document.body.style.height = h + 'px';
      document.body.style.overflow = 'hidden';
    }

    // Kotlin -> 终端：xterm 的 write 接受 Uint8Array，会自行做 UTF-8 解码，
    // 因此跨 chunk 切断的多字节字符也能正确拼回来。
    window.linboxFeed = function (base64) {
      try {
        if (!term) { log('feed: term 还没建好，丢弃 ' + base64.length + ' 字符'); return; }
        var bin = atob(base64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        term.write(bytes);
        log('feed: 已写入 ' + bytes.length + ' 字节 | 行数=' + term.buffer.active.length +
            ' 光标=' + term.buffer.active.cursorX + ',' + term.buffer.active.cursorY +
            ' | 屏=' + box(term.element) + ' | visible=' + document.visibilityState);
      } catch (e) {
        log('feed 异常: ' + e);
      }
    };

    window.linboxExit = function (code) {
      if (!term) return;
      term.write('\r\n\u001b[33m[会话已结束，退出码 ' + code + '] 点上方「重开会话」可重开\u001b[0m\r\n');
    };

    // 用视觉视口而不是元素 rect：真机实测 WebView 刚建立时 getBoundingClientRect()
    // 会给出「428x85」这种布局还没生效的值，导致 xterm 只画 5 行且看不见文字。
    function measure() {
      return [window.innerWidth, window.innerHeight];
    }

    function start(attempt) {
      if (started) return;
      var size = measure();
      if ((size[0] < MIN_W || size[1] < MIN_H) && attempt < MAX_TRIES) {
        setTimeout(function () { start(attempt + 1); }, 100);
        return;
      }
      started = true;

      var wide = size[0] >= MIN_W && size[1] >= MIN_H;
      fitHost(wide ? size[0] : MIN_W, wide ? size[1] : MIN_H);

      var cols, rows;
      if (wide) {
        cols = Math.max(20, Math.floor(size[0] / CELL_W));
        rows = Math.max(5, Math.floor(size[1] / CELL_H));
      } else {
        // 视口一直没量出来：用兜底值先把会话开起来，不把用户卡在这儿
        cols = FALLBACK_COLS;
        rows = FALLBACK_ROWS;
      }

      try {
        term = new Terminal({
          fontSize: FONT_SIZE,
          cursorBlink: true,
          scrollback: 2000,
          theme: { background: '#000000', foreground: '#e6e6e6' }
        });
        term.open(document.getElementById('t'));
        window.term = term;
      } catch (e) {
        log('终端初始化失败: ' + e);
        return;
      }

      term.onData(function (data) {
        try { LinboxBridge.write(toBase64(encoder.encode(data))); } catch (e) { }
      });

      term.resize(cols, rows);
      var t = document.getElementById('t');
      log('viewport ' + size[0] + 'x' + size[1] + ' -> ' + cols + 'x' + rows + ' (try ' + attempt + ')');
      log('open OK | 宿主=' + box(t) + ' | xterm=' + box(term.element) +
          ' | 行容器=' + box(document.querySelector('.xterm-rows')) +
          ' | 屏=' + box(document.querySelector('.xterm-screen')) +
          ' | body=' + box(document.body) + ' | html=' + box(document.documentElement));

      // 只报一次：busybox script 不支持会话中途 resize
      try { LinboxBridge.ready(cols, rows); } catch (e) { }
      term.focus();

      // 自证：不走 PTY，直接往终端写一行，验证渲染通路是否通
      setTimeout(function () {
        try {
          term.write('\u001b[36m[k60-linbox] 终端渲染自检\u001b[0m\r\n$ ');
          log('selftest: 已写入自检文本');
        } catch (e) { log('selftest 异常: ' + e); }
      }, 300);
    }

    if (document.readyState === 'complete') start(0);
    else window.addEventListener('load', function () { start(0); });
  })();
  </script>
</body>
</html>
