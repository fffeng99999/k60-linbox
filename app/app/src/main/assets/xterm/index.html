<!doctype html>
<!--
  k60-linbox 内嵌终端：xterm.js（MIT）负责渲染，PTY 由设备端 `linbox attach`
  （busybox script）提供。数据不经内存字符串，一律 base64 走 JS 桥。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #t { width: 100vw; height: 100vh; padding: 2px 0 0 2px; box-sizing: border-box; }
    #hint { position: absolute; left: 8px; bottom: 6px; color: #888; font: 12px monospace; }
  </style>
</head>
<body>
  <div id="t"></div>
  <div id="hint"></div>
  <script src="xterm.js"></script>
  <script>
  (function () {
    var FONT_SIZE = 14;
    var ROWS_PER_CHAR = 1.2;   // 等宽字体的近似行高系数
    var COLS_PER_CHAR = 0.6;   // 等宽字体的近似字符宽系数

    var term = new Terminal({
      fontSize: FONT_SIZE,
      cursorBlink: true,
      scrollback: 2000,
      theme: { background: '#000000', foreground: '#e6e6e6' }
    });
    term.open(document.getElementById('t'));
    window.term = term;

    var encoder = new TextEncoder();

    function bytesToBase64(bytes) {
      var s = '';
      for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      return btoa(s);
    }

    // 键盘输入 -> Kotlin（base64 承载 UTF-8 字节，避免中文/转义字符被破坏）
    term.onData(function (data) {
      try { LinboxBridge.write(bytesToBase64(encoder.encode(data))); } catch (e) { }
    });

    // Kotlin -> 终端：xterm 的 write 接受 Uint8Array，会自行做 UTF-8 解码，
    // 因此跨 chunk 切断的多字节字符也能正确拼接。
    window.linboxFeed = function (base64) {
      var bin = atob(base64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      term.write(bytes);
    };

    window.linboxExit = function (code) {
      term.write('\r\n\u001b[33m[会话已结束，退出码 ' + code + '] 点上方「刷新」可重开\u001b[0m\r\n');
    };

    // busybox script 不支持运行中改窗口大小，所以在会话开始前只算一次列行数。
    function measure() {
      var rect = document.getElementById('t').getBoundingClientRect();
      var charW = Math.max(4, Math.round(FONT_SIZE * COLS_PER_CHAR));
      var charH = Math.max(8, Math.round(FONT_SIZE * ROWS_PER_CHAR));
      var cols = Math.max(20, Math.floor(rect.width / charW));
      var rows = Math.max(5, Math.floor(rect.height / charH));
      return [cols, rows];
    }

    function boot() {
      var size = measure();
      document.getElementById('hint').textContent = size[0] + 'x' + size[1];
      try { LinboxBridge.ready(size[0], size[1]); } catch (e) { }
      term.focus();
    }

    if (document.readyState === 'complete') setTimeout(boot, 60);
    else window.addEventListener('load', function () { setTimeout(boot, 60); });
  })();
  </script>
</body>
</html>
