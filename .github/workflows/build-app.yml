name: build-k60-linbox-app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-app.yml"
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          set -euxo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -euxo pipefail
          gradle -p app assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euxo pipefail
          ls -l app/app/build/outputs/apk/debug/
          test -s app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: k60-linbox-manager-apk-${{ github.sha }}
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release create "$GITHUB_REF_NAME" \
            app/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "k60-linbox manager $GITHUB_REF_NAME" \
            --generate-notes
