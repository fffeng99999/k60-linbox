name: build-k60-linbox-app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-app.yml"
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 的 ubuntu runner 已预装 Android SDK 与 cmdline-tools，
      # 因此不再用 android-actions/setup-android（它默认装已下线的 `tools` 包会失败），
      # 直接调用预装的 sdkmanager 安装所需包。
      - name: Install SDK packages
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMGR" ]; then
            echo "未找到 sdkmanager（SDK=$SDK）" >&2
            exit 1
          fi
          echo "using $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$SDK" > app/local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -euxo pipefail
          gradle -p app assembleDebug --no-daemon --stacktrace

      - name: Verify APK and generate release.json
        run: |
          set -euxo pipefail
          ls -l app/app/build/outputs/apk/debug/
          test -s app/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p out
          cp app/app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk

          # 版本号取自 Gradle 脚本，minProtocol 取自 App 里声明的协议常量。
          VERSION_NAME="$(sed -n 's/^\s*versionName = "\([^"]*\)"$/\1/p' app/app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/^\s*versionCode = \([0-9]*\)$/\1/p' app/app/build.gradle.kts | head -n1)"
          MIN_PROTOCOL="$(sed -n 's/.*const val PROTOCOL = \([0-9]*\).*/\1/p' \
            app/app/src/main/java/com/k60linbox/manager/runtime/LinboxJson.kt | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          test -n "$MIN_PROTOCOL"
          printf '{"app":{"versionName":"%s","versionCode":%s,"minProtocol":%s},"tag":"%s"}\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$MIN_PROTOCOL" "$GITHUB_REF_NAME" > out/release.json
          ( cd out && sha256sum app-debug.apk release.json > SHA256SUMS )
          cat out/release.json
          cat out/SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: k60-linbox-manager-apk-${{ github.sha }}
          path: |
            out/app-debug.apk
            out/release.json
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release create "$GITHUB_REF_NAME" \
            out/app-debug.apk \
            out/release.json \
            out/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "k60-linbox manager $GITHUB_REF_NAME" \
            --generate-notes
