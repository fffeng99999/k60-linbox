name: build-k60-linbox-app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-app.yml"
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 的 ubuntu runner 已预装 Android SDK 与 cmdline-tools，
      # 因此不再用 android-actions/setup-android（它默认装已下线的 `tools` 包会失败），
      # 直接调用预装的 sdkmanager 安装所需包。
      - name: Install SDK packages
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMGR" ]; then
            echo "未找到 sdkmanager（SDK=$SDK）" >&2
            exit 1
          fi
          echo "using $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$SDK" > app/local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -euxo pipefail
          gradle -p app assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euxo pipefail
          ls -l app/app/build/outputs/apk/debug/
          test -s app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: k60-linbox-manager-apk-${{ github.sha }}
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release create "$GITHUB_REF_NAME" \
            app/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "k60-linbox manager $GITHUB_REF_NAME" \
            --generate-notes
